services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: vani
      POSTGRES_USER: vani
      POSTGRES_PASSWORD: vani
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vani-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vani -d vani"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      VANI_API_HOST: 0.0.0.0
      VANI_API_PORT: 8080
      VANI_WEB_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://vani:vani@postgres:5432/vani
      VANI_DATA_DIR: /var/lib/vani
      VANI_DEMO_MODE: "true"
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vani-data:/var/lib/vani
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  vani-postgres:
  vani-data:
