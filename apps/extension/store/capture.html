<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VANI browser capture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        background: #f6f5f0;
        color: #243d35;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        gap: 68px;
        padding: 40px 72px;
      }
      .copy {
        flex: 1;
      }
      .brand {
        font-size: 23px;
        font-weight: 750;
        letter-spacing: 3px;
        color: #285b49;
      }
      .eyebrow {
        margin-top: 65px;
        font-size: 14px;
        letter-spacing: 2px;
        color: #62736a;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 58px;
        line-height: 1.12;
        font-weight: 500;
        letter-spacing: -1.5px;
        margin: 18px 0 28px;
      }
      p {
        font-size: 21px;
        line-height: 1.65;
        max-width: 495px;
        color: #62736a;
      }
      .note {
        font-size: 13px;
        margin-top: 45px;
      }
      .capture {
        width: 410px;
        height: 720px;
        flex: none;
        box-shadow: 0 18px 50px #285b4924;
        border: 1px solid #d8dfd5;
        border-radius: 12px;
        overflow: hidden;
        background: #f6f5f0;
      }
      .capture img {
        display: block;
        width: 410px;
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand">VANI</div>
      <div class="eyebrow">BROWSER CAPTURE</div>
      <h1>Keep the paper.<br />Connect the ideas.</h1>
      <p>
        Review the details. Choose a collection.<br />Save the source and
        available PDF<br />to your local research workspace.
      </p>
      <p class="note">
        Requires a local VANI installation.<br />Shown with sample research
        data.
      </p>
    </section>
    <div class="capture">
      <img
        src="popup-example.png"
        alt="VANI popup showing a paper and PDF saved to a collection"
      />
    </div>
  </body>
</html>
